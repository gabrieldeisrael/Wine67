name: Teste de Flags, Sintaxe e Integridade (Wine67)

on:
  push:
    paths:
      - '*.sh'
      - 'debug/*.sh'
      - '.github/workflows/test-cs16.yml'
  workflow_dispatch:

jobs:
  test-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe do Bash em todos os scripts
        run: |
          bash -n wine67.sh
          bash -n cswine67.sh
          bash -n startx.sh
          bash -n debug/wine67debug.sh
          echo "Sintaxe de todos os scripts verificada com sucesso."

  test-flags:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flag:
          - --dontdotnet
          - --dontgecko
          - --dontvulkan
          - --igotsudo
          - --help
          - --saymyname
          - --todaysword
          - --make-me-a-sandwich
          - --beer
    steps:
      - uses: actions/checkout@v4
      - name: Executar flag ${{ matrix.flag }}
        run: |
          chmod +x wine67.sh
          if [ "${{ matrix.flag }}" = "--igotsudo" ]; then
            OUTPUT=$(./wine67.sh --igotsudo 2>&1) || true
            echo "$OUTPUT"
          elif [ "${{ matrix.flag }}" = "--help" ]; then
            OUTPUT=$(./wine67.sh --help 2>&1) || true
            echo "$OUTPUT" | grep -q "Wine67" || exit 1
          elif [ "${{ matrix.flag }}" = "--saymyname" ]; then
            OUTPUT=$(./wine67.sh --saymyname 2>&1) || true
            echo "$OUTPUT"
          elif [ "${{ matrix.flag }}" = "--todaysword" ]; then
            OUTPUT=$(./wine67.sh --todaysword 2>&1) || true
            echo "$OUTPUT"
          elif [ "${{ matrix.flag }}" = "--make-me-a-sandwich" ]; then
            OUTPUT=$(./wine67.sh --make-me-a-sandwich 2>&1) || true
            echo "$OUTPUT"
          elif [ "${{ matrix.flag }}" = "--beer" ]; then
            OUTPUT=$(./wine67.sh --beer 2>&1) || true
            echo "$OUTPUT"
          else
            OUTPUT=$(./wine67.sh ${{ matrix.flag }} --test 2>&1) || true
            echo "$OUTPUT"
          fi
          echo "Flag ${{ matrix.flag }} testada com sucesso."

  test-debug-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar modo dry-run do debug
        run: |
          chmod +x debug/wine67debug.sh
          # Cria um dummy .exe para teste dry-run
          mkdir -p apps
          touch apps/dummy.exe
          OUTPUT=$(./wine67.sh --dontvulkan --dontdotnet --dontgecko --dry-run apps/dummy.exe 2>&1) || true
          echo "Dry run output: $OUTPUT"

  test-cs16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências de interface
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-apps wget
      - name: Baixar o CS 1.6 Portable
        run: |
          wget -O cs16.exe "https://github.com/gabrieldeisrael/Wine67/releases/download/v1.2/Counter-Strike_1.6_Portable.exe" || true
      - name: Rodar com DXVK e capturar screenshot (se arquivo baixado)
        run: |
          if [ -f "cs16.exe" ]; then
            Xvfb :99 -screen 0 1024x768x24 &
            export DISPLAY=:99
            sleep 2
            chmod +x wine67.sh
            ./wine67.sh --dontvulkan --dontdotnet --dontgecko cs16.exe &
            sleep 15
            xwd -root -silent | convert xwd:- "screenshot-cs16.png" || true
          else
            echo "cs16.exe não baixado, ignorando teste gráfico do CS 1.6"
          fi
      - name: Salvar screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-cs16
          path: screenshot-cs16.png
