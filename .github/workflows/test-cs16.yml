name: Teste CS 1.6 Portable (Wine67)

on:
  push:
    paths:
      - 'wine67.sh'
  workflow_dispatch:

jobs:
  test-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Xvfb, imagemagick e x11-apps (pra screenshot)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-apps

      - name: Baixar o CS 1.6 Portable na mesma pasta do wine67.sh
        run: |
          wget -O cs16.exe \
            "https://github.com/gabrieldeisrael/Wine67/releases/download/v1.2/Counter-Strike_1.6_Portable.exe"

      - name: Rodar wine67.sh e tirar screenshots ao longo de 1 minuto
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 2
          chmod +x wine67.sh
          ./wine67.sh --dontdotnet --dontgecko cs16.exe &
          for t in 10 30 60; do
            sleep_time=$((t - ${elapsed:-0}))
            sleep "$sleep_time"
            elapsed=$t
            xwd -root -silent | convert xwd:- "screenshot-${t}s.png" || true
          done

      - name: Salvar screenshots como artefato
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-teste
          path: screenshot-*.png
